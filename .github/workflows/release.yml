# 發 release：打四個產物（App、hub-kit、mcp-kit、runner-kit），附到 GitHub
# Release。App 的「下載安裝」就是從這裡的資產抓的，少附一個等於那一包裝不了。
#
# 四個產物共用同一顆 commit 的 `_build.json`／`--dart-define`，所以收到的人
# 可以交叉比對 Hub、bridge、App 是不是同一份程式碼——那是這整套版本戳
# 唯一的用途，一邊對不上就失去意義。
name: Release

on:
  # 接在 master 的 CI 之後：CI 整條（python＋flutter）綠了才發，
  # 不再自己重跑一次 pytest／flutter test（原本 tag 推上去時兩條並行各跑一次）。
  # ⚠️ workflow_run 只讀預設分支（master）上的這支檔案。
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # 手動也能發（補發、或 tag 在 CI 跑完後才打時）。給的 tag 必須已經存在，
  # 且它指向的 commit 在 master 上的 CI 必須是綠的。
  workflow_dispatch:
    inputs:
      tag:
        description: '要發的 tag（例：v1.2.1）'
        required: true

permissions:
  contents: write  # 建立 Release 需要
  actions: read    # 手動發版時查 CI 結果

jobs:
  # 決定要發哪個 tag。CI 觸發時找指向那顆 commit 的 v* tag，沒有就不發
  # （一般的 master 推送）；手動觸發時確認那顆 commit 的 CI 綠過。
  resolve:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            SHA=$(git rev-parse "$TAG^{commit}")
            OK=$(gh run list --workflow CI --commit "$SHA" --event push \
                   --json conclusion -q '[.[] | select(.conclusion=="success")] | length')
            if [ "${OK:-0}" = "0" ]; then
              echo "✕ $TAG（$SHA）在 master 上沒有綠的 CI，不發"
              exit 1
            fi
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            # 同一顆 commit 有多個 tag 時取版本最新的那個
            TAG=$(git tag --points-at "$SHA" --list 'v*' | sort -V | tail -n 1)
            if [ -z "$TAG" ]; then
              echo "這顆 commit（$SHA）沒有 v* tag，不發 release"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          # 打包要讀 git 資訊（buildstamp 取 commit 與 dirty 狀態）
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: 安裝依賴
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      # 🚨 版本一致性：tag 與程式碼裡的 APP_VERSION 必須相同。
      # 不檢查的話會發出「tag 寫 v1.3.0、產物 _build.json 寫 1.2.1」的
      # release——收到的人兩邊都看得到，卻無從得知哪個才對。
      - name: 檢查 tag 與 APP_VERSION 一致
        shell: bash
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          WANT="${TAG#v}"
          # 熱修 tag 長 `v1.2.4-hotfix1`：版號不動、只重發 Release，
          # 比對時把 `-hotfix<n>` 剝掉，三端的版本字串仍然是 1.2.4
          WANT="${WANT%%-hotfix*}"
          for f in server/chatroom_server/version.py bridge/chatroom_mcp/version.py; do
            # 用 sed 不用 `grep -oP`：PCRE 在 Windows runner 的 Git Bash 上
            # 不保證有，缺了會變成「檢查沒跑但看起來跑過」
            GOT=$(sed -n 's/.*APP_VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$f")
            if [ "$GOT" != "$WANT" ]; then
              echo "✕ $f 的 APP_VERSION=$GOT，與 tag $TAG（期望 $WANT）不符"
              exit 1
            fi
            echo "✓ $f = $GOT"
          done
          # App 的版本在 pubspec（格式 `1.2.1+1`，取 + 之前）。三處都要對得上——
          # 漏掉這處的話，Hub 與 bridge 標 1.3.0 而 App 自報 1.2.1，
          # 而 App 的版本是使用者唯一看得到的那個
          GOT=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          if [ "$GOT" != "$WANT" ]; then
            echo "✕ app/pubspec.yaml 的 version=$GOT，與 tag $TAG（期望 $WANT）不符"
            exit 1
          fi
          echo "✓ app/pubspec.yaml = $GOT"

      # 測試不在這裡重跑：resolve 已確認這顆 commit 在 master 的 CI 是綠的
      # （CI 觸發時本身就是那條綠的 run；手動觸發時查過）。
      # Build App 要 pub get，這一步原本附在 flutter test 裡
      - name: pub get
        working-directory: app
        run: flutter pub get

      - name: 打 install-kit
        run: python install-kit/build.py

      - name: 打 hub-kit
        run: python host-kit/build.py

      # runner-kit 用 `--expect`：期望值取自 **tag 指向的那顆 commit**，
      # 不是 `HEAD`。拿 HEAD 當期望值只驗得出自我一致——而 checkout 沒做
      # 或做錯的那個失效，自我一致照樣成立（見 buildstamp.require_commit）。
      - name: 打 runner-kit
        shell: bash
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          EXPECT=$(git rev-parse --short=12 "$TAG^{commit}")
          echo "期望的 commit：$EXPECT"
          python runner-kit/build.py --expect "$EXPECT"

      # ⚠️ 這裡刻意不用管線。`python build-app.py | tee log` 會讓 exit code
      # 變成 tee 的，build 失敗照樣綠燈——2026-09-11 在本機實際踩過一次。
      - name: Build App
        run: python scripts/build-app.py

      # App 不是單一檔案：exe 只是 C++ runner 殼，Dart 程式碼在 data/app.so。
      # 只發 exe 的話對方拿到的是一個跑不起來的殼。
      - name: 壓縮 App
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          Compress-Archive -Path app/build/windows/x64/runner/Release/* `
                           -DestinationPath "dist/chatroom-app-$tag-windows-x64.zip"

      - name: 建立 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true  # 先出草稿，人看過再按發布
          generate_release_notes: true
          files: |
            dist/chatroom-mcp-kit.zip
            dist/chatroom-hub-kit.zip
            dist/chatroom-runner-kit.zip
            dist/chatroom-app-*.zip
