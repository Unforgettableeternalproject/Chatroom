# 發 release：打四個產物（App、hub-kit、mcp-kit、runner-kit），附到 GitHub
# Release。App 的「下載安裝」就是從這裡的資產抓的，少附一個等於那一包裝不了。
#
# 四個產物共用同一顆 commit 的 `_build.json`／`--dart-define`，所以收到的人
# 可以交叉比對 Hub、bridge、App 是不是同一份程式碼——那是這整套版本戳
# 唯一的用途，一邊對不上就失去意義。
name: Release

on:
  # 接在 master／develop 的 CI 之後：CI 整條（python＋flutter）綠了才發，
  # 不再自己重跑一次 pytest／flutter test（原本 tag 推上去時兩條並行各跑一次）。
  # - master 只發正式與熱修 tag（`v1.2.9`、`v1.2.9-hotfix1`），絕不發 `-rc` tag。
  # - develop 只發 RC tag（`v1.2.9-rc1`），絕不發正式 tag。
  # ⚠️ workflow_run 只讀預設分支（master）上的這支檔案：要讓 develop 的 CI 觸發
  #    RC 自動發版，這支檔案必須已經在 master 上（只改 develop 不會生效）。
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, develop]
  # RC tag 推上去時：develop 的 CI 若早已綠了，workflow_run 不會再觸發（它在
  # tag 之前就跑完了），所以 RC tag 的推送本身也要能發。CI 還沒跑完時這條會因
  # 「沒有綠的 CI」而失敗，之後由 workflow_run 在 CI 完成時補上。
  push:
    tags: ['v*-rc*']
  # 手動也能發（補發、或 tag 在 CI 跑完後才打時）。給的 tag 必須已經存在，
  # 且它指向的 commit 的 CI 必須是綠的：正式／熱修 tag 看 master，
  # RC tag（`v*-rc<n>`）看 develop 或 master。
  workflow_dispatch:
    inputs:
      tag:
        description: '要發的 tag（例：v1.2.1；RC 例：v1.2.9-rc1）'
        required: true

permissions:
  contents: write  # 建立 Release 需要
  actions: read    # 手動發版時查 CI 結果

jobs:
  # 決定要發哪個 tag。CI 觸發時找指向那顆 commit 的 v* tag，沒有就不發
  # （一般的 master 推送）；手動觸發時確認那顆 commit 的 CI 綠過。
  resolve:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      # RC tag 發 prerelease（不設為 latest，App 的 releases/latest 看不到）
      prerelease: ${{ steps.pick.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          RC_RE='-rc[0-9]+$'
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then
            TAG="$INPUT_TAG"
            [ "$EVENT" = "push" ] && TAG="$PUSHED_TAG"
            SHA=$(git rev-parse "$TAG^{commit}")
            # RC tag 從 develop 發（也接受已進 master 的 commit）；
            # 正式／熱修 tag 一樣只看 CI 有沒有綠過，行為不變
            if echo "$TAG" | grep -Eq -e "$RC_RE"; then
              OK=$(gh run list --workflow CI --commit "$SHA" --event push \
                     --json conclusion,headBranch \
                     -q '[.[] | select(.conclusion=="success" and (.headBranch=="develop" or .headBranch=="master"))] | length')
              WHERE="develop／master"
            else
              OK=$(gh run list --workflow CI --commit "$SHA" --event push \
                     --json conclusion -q '[.[] | select(.conclusion=="success")] | length')
              WHERE="master"
            fi
            if [ "${OK:-0}" = "0" ]; then
              echo "✕ $TAG（$SHA）在 $WHERE 上沒有綠的 CI，不發"
              exit 1
            fi
          else
            SHA="$RUN_SHA"
            # 同一顆 commit 有多個 tag 時取版本最新的那個。
            # develop 只認 RC tag、master 只認非 RC tag——兩邊不互發
            if [ "$RUN_BRANCH" = "develop" ]; then
              TAG=$(git tag --points-at "$SHA" --list 'v*' | grep -E -e "$RC_RE" | sort -V | tail -n 1)
            else
              TAG=$(git tag --points-at "$SHA" --list 'v*' | grep -Ev -e "$RC_RE" | sort -V | tail -n 1)
            fi
            if [ -z "$TAG" ]; then
              echo "這顆 commit（$SHA，$RUN_BRANCH）沒有符合的 v* tag，不發 release"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -Eq -e "$RC_RE"; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          # 打包要讀 git 資訊（buildstamp 取 commit 與 dirty 狀態）
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: 安裝依賴
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      # 🚨 版本一致性：tag 與程式碼裡的 APP_VERSION 必須相同。
      # 不檢查的話會發出「tag 寫 v1.3.0、產物 _build.json 寫 1.2.1」的
      # release——收到的人兩邊都看得到，卻無從得知哪個才對。
      - name: 檢查 tag 與 APP_VERSION 一致
        shell: bash
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          WANT="${TAG#v}"
          # 熱修 tag 長 `v1.2.4-hotfix1`：版號不動、只重發 Release，
          # 比對時把 `-hotfix<n>` 剝掉，三端的版本字串仍然是 1.2.4
          WANT="${WANT%%-hotfix*}"
          # RC tag 長 `v1.2.9-rc1`：版號檔已經是 1.2.9，同樣剝掉後綴再比
          WANT="${WANT%%-rc*}"
          for f in server/chatroom_server/version.py bridge/chatroom_mcp/version.py; do
            # 用 sed 不用 `grep -oP`：PCRE 在 Windows runner 的 Git Bash 上
            # 不保證有，缺了會變成「檢查沒跑但看起來跑過」
            GOT=$(sed -n 's/.*APP_VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$f")
            if [ "$GOT" != "$WANT" ]; then
              echo "✕ $f 的 APP_VERSION=$GOT，與 tag $TAG（期望 $WANT）不符"
              exit 1
            fi
            echo "✓ $f = $GOT"
          done
          # App 的版本在 pubspec（格式 `1.2.1+1`，取 + 之前）。三處都要對得上——
          # 漏掉這處的話，Hub 與 bridge 標 1.3.0 而 App 自報 1.2.1，
          # 而 App 的版本是使用者唯一看得到的那個
          GOT=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          if [ "$GOT" != "$WANT" ]; then
            echo "✕ app/pubspec.yaml 的 version=$GOT，與 tag $TAG（期望 $WANT）不符"
            exit 1
          fi
          echo "✓ app/pubspec.yaml = $GOT"

      # 測試不在這裡重跑：resolve 已確認這顆 commit 在 master 的 CI 是綠的
      # （CI 觸發時本身就是那條綠的 run；手動觸發時查過）。
      # Build App 要 pub get，這一步原本附在 flutter test 裡
      - name: pub get
        working-directory: app
        run: flutter pub get

      - name: 打 install-kit
        run: python install-kit/build.py

      - name: 打 hub-kit
        run: python host-kit/build.py

      # runner-kit 用 `--expect`：期望值取自 **tag 指向的那顆 commit**，
      # 不是 `HEAD`。拿 HEAD 當期望值只驗得出自我一致——而 checkout 沒做
      # 或做錯的那個失效，自我一致照樣成立（見 buildstamp.require_commit）。
      - name: 打 runner-kit
        shell: bash
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          EXPECT=$(git rev-parse --short=12 "$TAG^{commit}")
          echo "期望的 commit：$EXPECT"
          python runner-kit/build.py --expect "$EXPECT"

      # ⚠️ 這裡刻意不用管線。`python build-app.py | tee log` 會讓 exit code
      # 變成 tee 的，build 失敗照樣綠燈——2026-09-11 在本機實際踩過一次。
      # tag 帶進去，App 才知道自己是第幾個熱修（`-hotfix<n>`）
      - name: Build App
        env:
          CHATROOM_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: python scripts/build-app.py

      # App 不是單一檔案：exe 只是 C++ runner 殼，Dart 程式碼在 data/app.so。
      # 只發 exe 的話對方拿到的是一個跑不起來的殼。
      - name: 壓縮 App
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          Compress-Archive -Path app/build/windows/x64/runner/Release/* `
                           -DestinationPath "dist/chatroom-app-$tag-windows-x64.zip"

      # 公告內文：發版說明檔＋這一版的 PR 清單，格式與過去手寫的公告相同。
      # - 說明檔先找 tag 專屬的 `RELEASE-NOTES-<tag>.md`（熱修可以自己寫一份），
      #   沒有再找版號的 `RELEASE-NOTES-v<版號>.md`——但只有正式版與 RC 退到這份；
      #   熱修沿用正式版的說明等於把整版內容再公告一次，寧可只放 PR 清單。
      # - 第一行標題換成實際的 tag；RC 在標題下標明是測試版。
      # - PR 清單用 GitHub 的 generate-notes，起點**明確指定**為上一個非 RC 的 tag
      #   （依版本排序）。交給 GitHub 自己猜時，RC 從 develop 發，它會從 PR #1 一路列下來。
      - name: 準備公告內文
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_RC: ${{ needs.resolve.outputs.prerelease }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          BASE="${TAG#v}"; BASE="${BASE%%-rc*}"; BASE="${BASE%%-hotfix*}"
          NOTES=""
          if [ -f "docs/release_note/RELEASE-NOTES-$TAG.md" ]; then
            NOTES="docs/release_note/RELEASE-NOTES-$TAG.md"
          elif [ "$TAG" = "v$BASE" ] || [ "$IS_RC" = "true" ]; then
            [ -f "docs/release_note/RELEASE-NOTES-v$BASE.md" ] && NOTES="docs/release_note/RELEASE-NOTES-v$BASE.md"
          fi

          # 上一個非 RC 的 tag：把目前的 tag（RC 去掉後綴）放進非 RC tag 清單裡排序，取它前一個
          KEY="${TAG%%-rc*}"
          PREV=$( { git tag -l 'v*' | grep -Ev -e '-rc[0-9]+$' | grep -vx -e "$KEY"; echo "$KEY"; } \
                  | sort -V | grep -B1 -x -e "$KEY" | head -n 1 )
          [ "$PREV" = "$KEY" ] && PREV=""
          echo "說明檔：${NOTES:-（無）}；PR 清單起點：${PREV:-（無）}"

          OUT=release-body.md
          : > "$OUT"
          if [ -n "$NOTES" ]; then
            echo "# Chatroom $TAG" >> "$OUT"
            if [ "$IS_RC" = "true" ]; then
              printf '\n> ⚠️ 這是 v%s 的測試版（Release Candidate），尚未正式發布，請勿用於正式環境。正式版發出後，「檢查更新」會提示升級。\n' "$BASE" >> "$OUT"
            fi
            tail -n +2 "$NOTES" >> "$OUT"
            echo >> "$OUT"
          else
            echo "::warning::$TAG 沒有對應的發版說明檔，公告只有 PR 清單，發布前要手動補"
          fi
          ARGS=(-f "tag_name=$TAG")
          [ -n "$PREV" ] && ARGS+=(-f "previous_tag_name=$PREV")
          gh api "repos/${{ github.repository }}/releases/generate-notes" "${ARGS[@]}" --jq .body >> "$OUT"
          echo "----- 公告內文 -----"; cat "$OUT"

      - name: 建立 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Chatroom ${{ env.RELEASE_TAG }}
          draft: true  # 先出草稿，人看過再按發布
          # 內文由上一步組好（說明檔＋指定起點的 PR 清單），不再讓 action 自己產生
          body_path: release-body.md
          # RC：prerelease 且不設為 latest（App 檢查更新查 releases/latest，看不到）；
          # 正式版維持原行為（latest）
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.resolve.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            dist/chatroom-mcp-kit.zip
            dist/chatroom-hub-kit.zip
            dist/chatroom-runner-kit.zip
            dist/chatroom-app-*.zip

  # ──────────────────────────────────────────────────────────────────────
  # macOS／Linux 的 App。**接在 `release` 之後**（needs）而不是並行：
  # `release` 負責建立 draft release 與其他產物，這裡只往同一個 draft 補檔。
  # 並行的話兩邊會同時建 draft，產生兩份同 tag 的草稿。
  # Windows 產物流程不受影響；代價是 mac／Linux 失敗時 draft 仍存在但少那一包——
  # 少了就不要按發布。
  # sha256 不用另外產：App 驗的是 GitHub 在資產上自動附的 `digest`
  # （見 `app_updater.dart` 的 `_sha256Of`），上傳後自動有。
  # ──────────────────────────────────────────────────────────────────────
  app-macos:
    needs: [resolve, release]
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      # 有這組 secrets 才走 Developer ID + notarization；沒有就 ad-hoc。
      # 日後申請了 Apple Developer 只要補 secrets，不必改 workflow：
      #   MACOS_SIGN_IDENTITY   例：Developer ID Application: Name (TEAMID)
      #   MACOS_CERT_P12        .p12 憑證的 base64
      #   MACOS_CERT_PASSWORD   .p12 密碼
      #   MACOS_NOTARY_APPLE_ID / MACOS_NOTARY_TEAM_ID / MACOS_NOTARY_PASSWORD
      #                         notarytool 用（Apple ID、Team ID、App 專用密碼）
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      APP_BUNDLE: app/build/macos/Build/Products/Release/Chatroom.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: pub get
        working-directory: app
        run: flutter pub get

      # 同樣不用管線，exit code 才不會被吃掉（見 release job 的說明）
      - name: Build App
        env:
          CHATROOM_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: python scripts/build-app.py --platform macos

      # universal 是 App 自更新的約定（資產名 macos-universal）；少一個架構
      # 的話另一種 Mac 上會裝得起來卻開不了
      - name: 確認 universal
        run: |
          ARCHS=$(lipo -archs "$APP_BUNDLE/Contents/MacOS/Chatroom")
          echo "架構：$ARCHS"
          case "$ARCHS" in
            *arm64*x86_64*|*x86_64*arm64*) ;;
            *) echo "✕ 不是 universal（$ARCHS）"; exit 1 ;;
          esac

      - name: 簽章（ad-hoc）
        if: env.MACOS_SIGN_IDENTITY == ''
        run: |
          codesign --force --deep -s - "$APP_BUNDLE"
          codesign --verify --deep --strict "$APP_BUNDLE"

      - name: 簽章（Developer ID）
        if: env.MACOS_SIGN_IDENTITY != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          codesign --force --deep --options runtime --timestamp \
            -s "$MACOS_SIGN_IDENTITY" "$APP_BUNDLE"
          codesign --verify --deep --strict "$APP_BUNDLE"
          rm -f "$RUNNER_TEMP/cert.p12"

      # notarization 要送 zip；staple 之後的 .app 才是要發的那份
      - name: Notarize
        if: env.MACOS_SIGN_IDENTITY != '' && env.MACOS_NOTARY_APPLE_ID != ''
        run: |
          ditto -c -k --keepParent "$APP_BUNDLE" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "$APP_BUNDLE"
          xcrun stapler validate "$APP_BUNDLE"

      - name: 打包
        env:
          CHATROOM_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: python scripts/build-app.py --platform macos --package-only

      - name: 附到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.resolve.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: dist/chatroom-app-${{ env.RELEASE_TAG }}-macos-universal.zip
          fail_on_unmatched_files: true

  app-linux:
    needs: [resolve, release]
    # 固定 LTS：產物連結的 glibc 版本由建置機決定，ubuntu-latest 升版後
    # 建出的 App 會在較舊的發行版上無法執行。
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: 安裝 Linux 桌面建置依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev \
            libjsoncpp-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            clang cmake ninja-build pkg-config liblzma-dev

      - name: pub get
        working-directory: app
        run: flutter pub get

      # --package 會檢查執行檔存在且有執行位元才打 tar.gz
      - name: Build App 並打包
        env:
          CHATROOM_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: python scripts/build-app.py --platform linux --package

      - name: 附到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.resolve.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: dist/chatroom-app-${{ env.RELEASE_TAG }}-linux-x64.tar.gz
          fail_on_unmatched_files: true
