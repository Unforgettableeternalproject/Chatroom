[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatroom-mcp"
description = "Chatroom MCP Bridge — 把 Chatroom Hub 的 REST API 包成 MCP 工具"
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["version"]

# 相依版本明確界定：mcp 1.x → 2.x 是破壞性改名（FastMCP → MCPServer），
# 必須擋住主版本漂移；下界則是實測通過的版本。
dependencies = [
    "mcp>=2.1.1,<3.0",
    "httpx>=0.28.1,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
chatroom-mcp = "chatroom_mcp.server:main"

[tool.hatch.version]
path = "chatroom_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["chatroom_mcp"]
