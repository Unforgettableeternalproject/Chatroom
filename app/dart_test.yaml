# 契約測試需要一台活的 Hub，所以它有自己的標籤。
#
# 預設的 `flutter test` **會跑到它**，但沒有設 CHATROOM_TEST_URL /
# CHATROOM_TEST_TOKEN 時它整組跳過（skip，不是失敗）——這是刻意的：
# 用 `--exclude-tags` 把它排除在外的話，沒有人會記得它存在，
# 而一組沒有人跑的契約測試等於沒有契約測試。
tags:
  contract:
    # 打真 Hub，會建立並刪除資料。指向測試 Hub，不要指生產。
  golden:
    # 驗收用的對比圖。**同樣不排除**，理由同上——它是呼吸框偏位的回歸防線。
    # 但它對字型與平台敏感，紅的時候先分辨是哪一種：
    # focus_pulse_alignment_test（量位置）也紅 → 真的偏了，去修實作；
    # 只有 golden 紅 → 環境變了，用 --update-goldens 重產。
